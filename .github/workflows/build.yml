name: Mudabbir Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Generate Android host project
        run: |
          flutter create --platforms=android --project-name mudabbir_al_asrar --org com.mudabbir .
          rm -f test/widget_test.dart

      - name: Configure native device capabilities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 26")
          text = text.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
          text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          gradle.write_text(text)
          text = gradle.read_text()
          if 'ndkVersion = "27.0.12077973"' not in text:
              text = text.replace("android {", 'android {\n    ndkVersion = "27.0.12077973"', 1)
              gradle.write_text(text)

          settings = Path("android/settings.gradle.kts")
          if settings.exists():
              s = settings.read_text()
              s = s.replace('id("org.jetbrains.kotlin.android") version "1.8.22"', 'id("org.jetbrains.kotlin.android") version "2.2.0"')
              # Resolve Kotlin/Gradle plugin transitives from the canonical Maven
              # repositories instead of relying only on the Plugin Portal proxy.
              marker = "pluginManagement {"
              if marker in s:
                  start = s.index(marker)
                  repo_start = s.find("repositories {", start)
                  repo_end = s.find("}", repo_start)
                  if repo_start != -1 and repo_end != -1:
                      block = s[repo_start:repo_end]
                      if "google()" not in block:
                          s = s[:repo_start] + s[repo_start:repo_start + len("repositories {")] + chr(10) + "        google()" + s[repo_start + len("repositories {"):]
                      repo_start = s.find("repositories {", start)
                      repo_end = s.find("}", repo_start)
                      block = s[repo_start:repo_end]
                      if "mavenCentral()" not in block:
                          s = s[:repo_start] + s[repo_start:repo_start + len("repositories {")] + chr(10) + "        mavenCentral()" + s[repo_start + len("repositories {"):]
              settings.write_text(s)
          
          properties = Path("android/gradle.properties")
          if properties.exists():
              s = properties.read_text()
              if "android.useAndroidX=true" not in s: s += "\nandroid.useAndroidX=true\n"
              properties.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          marker = "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">"
          permissions = """
          <uses-permission android:name="android.permission.INTERNET" />\n          <uses-permission android:name="android.permission.CAMERA" />\n          <uses-permission android:name="android.permission.USE_BIOMETRIC" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
          <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
          <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
          <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
          <uses-feature android:name="android.hardware.camera.ar" android:required="false" />
          """
          if "android.permission.CAMERA" not in text:
              text = text.replace(marker, marker + permissions)
          manifest.write_text(text)

          activity = Path("android/app/src/main/kotlin/com/mudabbir/mudabbir_al_asrar/MainActivity.kt")
          if activity.exists():
              text = activity.read_text().replace("FlutterActivity", "FlutterFragmentActivity")
              if "FlutterFragmentActivity" not in text:
                  text = "import io.flutter.embedding.android.FlutterFragmentActivity\n\n" + text
              activity.write_text(text)
          else:
              for candidate in Path("android/app/src/main/kotlin").rglob("MainActivity.kt"):
                  text = candidate.read_text().replace("FlutterActivity", "FlutterFragmentActivity")
                  candidate.write_text(text)

          PY

      - name: Generate fixed QCF Mushaf layout
        run: python3 tool/generate_mushaf_layout.py

      - name: Install dependencies
        run: flutter pub get

      - name: Remove obsolete Tesseract Gradle buildscript
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          candidates = list(roots.glob("flutter_tesseract_ocr-*/android/build.gradle"))
          if not candidates:
              raise SystemExit("flutter_tesseract_ocr Gradle file was not found after pub get")

          for path in candidates:
              source = path.read_text()
              lines = source.splitlines(keepends=True)
              start = next((i for i, line in enumerate(lines)
                            if line.strip() == "buildscript {"), None)
              if start is not None:
                  depth = 0
                  end = None
                  for i in range(start, len(lines)):
                      depth += lines[i].count("{") - lines[i].count("}")
                      if i > start and depth == 0:
                          end = i + 1
                          break
                  if end is None:
                      raise SystemExit(f"Unclosed buildscript block in {path}")
                  lines = lines[:start] + lines[end:]
              patched = "".join(lines).replace("jcenter()", "mavenCentral()")
              if "jcenter()" in patched:
                  raise SystemExit(f"Stale jcenter() remains in {path}")
              path.write_text(patched)

          # tflite_flutter 0.12.1 has Java/Kotlin target drift in its
          # Gradle file on the newer toolchain; patch the cached plugin too.
          tflite_files = list(roots.glob("tflite_flutter-*/android/build.gradle"))
          if not tflite_files:
              raise SystemExit("tflite_flutter Gradle file was not found after pub get")
          for path in tflite_files:
              source = path.read_text()
              patched = source.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_17")
              patched = patched.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              if "JavaVersion.VERSION_11" in patched or "JavaVersion.VERSION_1_8" in patched:
                  raise SystemExit(f"Legacy Java target remains in {path}")
              if patched != source:
                  path.write_text(patched)

          # file_picker 10.x still declares compileSdk 34 while its
          # lifecycle dependency now requires Android API 36.
          picker_files = list(roots.glob("file_picker-*/android/build.gradle"))
          if not picker_files:
              raise SystemExit("file_picker Gradle file was not found after pub get")
          for path in picker_files:
              lines = path.read_text().splitlines(keepends=True)
              changed = False
              for index, line in enumerate(lines):
                  stripped = line.strip()
                  if stripped.startswith("compileSdkVersion ") and stripped.split()[-1].isdigit():
                      indent = line[:len(line) - len(line.lstrip())]
                      lines[index] = indent + "compileSdkVersion 36\n"
                      changed = True
                      break
                  if stripped.startswith("compileSdk = ") and stripped.split()[-1].isdigit():
                      indent = line[:len(line) - len(line.lstrip())]
                      lines[index] = indent + "compileSdk = 36\n"
                      changed = True
                      break
              if not changed:
                  raise SystemExit(f"Could not set compileSdk 36 in {path}")
              path.write_text("".join(lines))

          # Align Java compile tasks across Android subprojects with Kotlin JVM 17.
          root_gradle = Path("android/build.gradle.kts")
          if not root_gradle.exists():
              raise SystemExit("Generated Android root Gradle file was not found")
          root_text = root_gradle.read_text()
          marker = "// Mudabbir CI: align Java and Kotlin bytecode targets"
          if marker not in root_text:
              root_text += """

          // Mudabbir CI: align Java and Kotlin bytecode targets
          subprojects {
              tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
                  sourceCompatibility = JavaVersion.VERSION_17.toString()
                  targetCompatibility = JavaVersion.VERSION_17.toString()
              }
          }
          """
              root_gradle.write_text(root_text)
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: mudabbir-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: mudabbir-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: mudabbir-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
