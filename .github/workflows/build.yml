name: Mudabbir Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Generate Android host project
        run: flutter create --platforms=android --project-name mudabbir_al_asrar --org com.mudabbir .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze main.dart

      - name: Test
        run: flutter test test/mushaf_smoke_test.dart

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: mudabbir-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: mudabbir-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: mudabbir-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
